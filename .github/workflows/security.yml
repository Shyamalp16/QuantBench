name: security

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '17 8 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  secrets:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install pinned Gitleaks
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'gitleaks_8.30.1_windows_x64.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'gitleaks-8.30.1'
          Invoke-WebRequest -Uri 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip' -OutFile $archive
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($actualHash -ne 'D29144DEFF3A68AA93CED33DDDF84B7FDC26070ADD4AA0F4513094C8332AFC4E') {
            throw "Gitleaks archive hash mismatch: $actualHash"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $destination | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Scan repository history
        shell: pwsh
        run: gitleaks git --redact --no-banner .

  codeql:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp,javascript-typescript,python
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4

  dependencies-and-sbom:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.10.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v7
        with:
          python-version: 3.11.9
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.12.14
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          dotnet restore QuantBench.slnx --locked-mode
          $nugetAudit = dotnet list QuantBench.slnx package --vulnerable --include-transitive
          if ($LASTEXITCODE -ne 0) { throw 'NuGet vulnerability audit failed.' }
          $nugetAudit | Write-Host
          if ($nugetAudit -match '(?im)^\s*>\s+.+\s+(Low|Moderate|High|Critical)\s+https?://') {
            throw 'NuGet reported a vulnerable dependency.'
          }
          uv sync --frozen --all-groups --all-packages
          cargo fetch --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --file apps/desktop/src-tauri/Cargo.lock
          pnpm audit --audit-level high
          uv run pip-audit
          ./tools/inventory-licenses.ps1
      - uses: anchore/sbom-action@v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: artifacts/sbom/quantbench.cdx.json
      - uses: actions/upload-artifact@v6
        with:
          name: supply-chain-reports
          path: artifacts

