name: contract-compatibility

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  contract-compatibility:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reject schemas before Phase 2 compatibility controls
        shell: pwsh
        run: ./tools/verify-schemas.ps1
